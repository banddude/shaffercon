<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plug Me In | Shaffer Construction</title>
<meta name="description" content="Plug Me In, the Shaffer Construction music video. EV chargers, panel upgrades and electrical work in Los Angeles. (323) 642-8509.">
<link rel="canonical" href="https://shaffercon.com/plugmein/">
<meta property="og:title" content="Plug Me In | Shaffer Construction">
<meta property="og:description" content="A love song about an EV charger. The Shaffer Construction music video.">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://shaffercon.com/plugmein/">
<meta property="og:image" content="https://shaffercon.com/videos/pmi-poster-wide.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://shaffercon.com/videos/pmi-poster-wide.jpg">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; cursor: pointer; }
  #stage video, #stage .poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  /* Landscape shows the widescreen cut, portrait shows the vertical cut. Both keep playing,
     so flipping the phone just changes which one is visible: no reload, no skip. */
  .tall { opacity: 0; }
  .wide { opacity: 1; }
  @media (orientation: portrait) {
    .tall { opacity: 1; }
    .wide { opacity: 0; }
  }
  .poster { pointer-events: none; transition: opacity .25s; }
  #stage.started .poster { opacity: 0 !important; }
  #play {
    position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px;
    border-radius: 50%; background: rgba(0,0,0,.55); border: 3px solid #fff; display: grid; place-items: center;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  @media (orientation: portrait) { #play { top: 62%; } }
  #play::after { content: ""; margin-left: 8px; border-style: solid; border-width: 22px 0 22px 36px; border-color: transparent transparent transparent #fff; }
  #stage.playing #play { opacity: 0; transform: scale(.85); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; opacity: 0; transition: opacity .3s; }
  #stage.started #bar { opacity: 1; }
  #stage.playing.idle #bar { opacity: 0; }
  #track { position: absolute; left: 16px; right: 16px; bottom: max(12px, env(safe-area-inset-bottom)); height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #2E86C7; border-radius: 2px; }
</style>
</head>
<body>
<div id="stage" aria-label="Plug Me In music video. Tap to play or pause.">
  <video class="wide" src="/videos/pmi-wide.mp4" muted playsinline preload="auto"></video>
  <video class="tall" src="/videos/pmi-tall.mp4" muted playsinline preload="auto"></video>
  <img class="poster wide" src="/videos/pmi-poster-wide.jpg" alt="Shaffer Construction presents Plug Me In">
  <img class="poster tall" src="/videos/pmi-poster-tall.jpg" alt="Shaffer Construction presents Plug Me In">
  <div id="play"></div>
  <div id="bar"><div id="track"><div id="fill"></div></div></div>
</div>
<audio id="song" src="/videos/pmi-audio.m4a" preload="auto"></audio>
<script>
(() => {
  const stage = document.getElementById('stage');
  const song = document.getElementById('song');
  const vids = [...document.querySelectorAll('#stage video')];
  const fill = document.getElementById('fill');
  const track = document.getElementById('bar');
  let idleTimer = null;

  // The song is the clock. Both muted videos follow it.
  function sync() {
    const t = song.currentTime;
    for (const v of vids) {
      const drift = v.currentTime - t;
      if (Math.abs(drift) > 0.25) { v.currentTime = t; v.playbackRate = 1; }
      else if (Math.abs(drift) > 0.03) { v.playbackRate = Math.max(0.9, Math.min(1.1, 1 - drift * 1.5)); }
      else { v.playbackRate = 1; }
    }
    if (song.duration) fill.style.width = (100 * t / song.duration) + '%';
  }
  function loop() { sync(); if (!song.paused) requestAnimationFrame(loop); }

  function play() {
    stage.classList.add('started', 'playing');
    for (const v of vids) { v.currentTime = song.currentTime; v.play().catch(() => {}); }
    song.play().then(() => requestAnimationFrame(loop)).catch(() => stage.classList.remove('playing'));
    poke();
  }
  function pause() {
    song.pause(); vids.forEach(v => v.pause());
    stage.classList.remove('playing');
  }
  function poke() {
    stage.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => stage.classList.add('idle'), 2500);
  }

  stage.addEventListener('click', (e) => {
    if (e.target.closest('#bar') && stage.classList.contains('started')) {
      const r = document.getElementById('track').getBoundingClientRect();
      const k = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      if (song.duration) { song.currentTime = k * song.duration; vids.forEach(v => v.currentTime = song.currentTime); sync(); }
      poke();
      return;
    }
    song.paused ? play() : pause();
  });
  stage.addEventListener('pointermove', poke);

  // If a video stalls, hold the song so picture and sound stay together.
  for (const v of vids) {
    v.addEventListener('waiting', () => { if (!song.paused && getComputedStyle(v).opacity !== '0') { song.pause(); v.addEventListener('canplay', () => { if (stage.classList.contains('playing')) { song.play(); requestAnimationFrame(loop); } }, { once: true }); } });
  }
  song.addEventListener('ended', () => {
    pause(); song.currentTime = 0; vids.forEach(v => v.currentTime = 0);
    stage.classList.remove('started'); fill.style.width = '0';
  });
  document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); song.paused ? play() : pause(); } });
})();
</script>
</body>
</html>
