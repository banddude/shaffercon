name: Contact Form Submission

on:
  repository_dispatch:
    types: [contact-form-submission]

jobs:
  process-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: leads
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create leads directory if needed
        run: mkdir -p leads

      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Save submission to JSON
        env:
          ATTRIBUTION_JSON: ${{ toJson(github.event.client_payload.attribution) }}
        run: |
          FILENAME="leads/$(date -u +%Y-%m-%d_%H-%M-%S)_${{ github.event.client_payload.email }}.json"
          jq -n \
            --arg timestamp "${{ steps.timestamp.outputs.timestamp }}" \
            --arg firstName "${{ github.event.client_payload.firstName }}" \
            --arg lastName "${{ github.event.client_payload.lastName }}" \
            --arg email "${{ github.event.client_payload.email }}" \
            --arg phone "${{ github.event.client_payload.phone }}" \
            --arg address "${{ github.event.client_payload.address }}" \
            --arg message "${{ github.event.client_payload.message }}" \
            --argjson attribution "${ATTRIBUTION_JSON:-null}" \
            '{
              timestamp: $timestamp,
              firstName: $firstName,
              lastName: $lastName,
              email: $email,
              phone: $phone,
              address: $address,
              message: $message,
              attribution: $attribution
            }' > "$FILENAME"

      - name: Commit submission
        run: |
          git config user.name "Contact Form Bot"
          git config user.email "noreply@shaffercon.com"
          git add leads/
          git commit -m "📬 New contact from ${{ github.event.client_payload.firstName }} ${{ github.event.client_payload.lastName }} (${{ github.event.client_payload.email }})"
          git push origin leads

      - name: Open lead notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload;
            const title = `📬 Lead: ${p.firstName} ${p.lastName} (${p.email})`;
            const label = 'lead';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: '0e8a16',
                description: 'Contact form lead that needs a reply',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const body = [
              `@banddude new contact form submission.`,
              ``,
              `**Name:** ${p.firstName} ${p.lastName}`,
              `**Email:** ${p.email}`,
              `**Phone:** ${p.phone || '(not provided)'}`,
              `**Address:** ${p.address || '(not provided)'}`,
              `**Source page:** ${p.attribution?.pageUrl || '(not captured)'}`,
              `**Landing page:** ${p.attribution?.landingPage || '(not captured)'}`,
              `**Referrer:** ${p.attribution?.referrer || '(not captured)'}`,
              `**UTM:** ${[
                p.attribution?.utmSource,
                p.attribution?.utmMedium,
                p.attribution?.utmCampaign,
              ].filter(Boolean).join(' / ') || '(none)'}`,
              ``,
              `**Message:**`,
              ``,
              '```',
              p.message || '(no message)',
              '```',
              ``,
              `Close this issue once you've replied to the lead.`,
            ].join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
              assignees: ['banddude'],
            });
            await core.summary
              .addHeading('Lead notification issue created')
              .addLink(issue.data.html_url, issue.data.html_url)
              .write();
