name: PR checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  sync-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Offline sync tests (planning, append-only, pagination/async failures)"
        run: python3 scripts/test_sync_legacy_redirects.py
      - name: "404 redirect behavior (rendered template, loop guard, slash)"
        run: node scripts/test_not_found_redirects.mjs

  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: "Build (proves not-found.tsx and the embedded script compile)"
        run: |
          cd site
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: test
          NEXT_PUBLIC_GSC_VERIFICATION: test
          NEXT_PUBLIC_GITHUB_TOKEN: test
