name = "shaffercon-contact-form"
main = "contact-form.js"
compatibility_date = "2026-10-04"
workers_dev = true

# Requires the sending domain and this exact destination to be verified.
# This does not enable inbound Email Routing or change Google Workspace MX.
[[send_email]]
name = "EMAIL"
destination_address = "hello@shaffercon.com"
allowed_sender_addresses = ["contactform@shaffercon.com"]
